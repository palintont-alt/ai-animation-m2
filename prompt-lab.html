<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Lab</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html">🤖 AI ANIMATION <small>V2</small></a><nav><a href="index.html">หน้าแรก</a><a href="course.html">บทเรียน</a><a href="prompt-lab.html">Prompt Lab</a><a href="storyboard.html">Storyboard</a><a href="quiz.html">แบบทดสอบ</a><a href="mission.html">ภารกิจ</a><a href="dashboard.html">Dashboard</a></nav></header><main class="wrap page"><span class="tag">INTERACTIVE LAB</span><h1>✍️ Prompt Lab</h1><div class="lab"><section class="card form"><label>ตัวละคร<input id="char" placeholder="เด็กนักเรียนไทย ผมสั้น ใส่ชุดนักเรียน"></label><label>การกระทำ<input id="action" placeholder="กำลังวิ่งถือหนังสือ"></label><label>สถานที่<input id="place" placeholder="สนามโรงเรียนตอนเช้า"></label><label>อารมณ์<input id="mood" placeholder="ร่าเริง มั่นใจ"></label><label>สไตล์<select id="style"><option>3D animation, cinematic</option><option>2D cartoon</option><option>2D anime</option><option>stop motion</option></select></label><label>กล้อง<select id="camera"><option>medium shot</option><option>close-up</option><option>wide shot</option><option>tracking shot</option></select></label><button class="btn" onclick="buildPrompt()">✨ สร้าง Prompt</button></section><section class="card"><h2>ผลลัพธ์</h2><textarea id="output" class="bigtext" placeholder="Prompt จะปรากฏที่นี่"></textarea><button class="btn ghost" onclick="copyPrompt()">📋 คัดลอก</button><button class="btn" onclick="savePrompt()">💾 บันทึก Prompt</button><p id="copymsg"></p></section></div><section class="card"><h2>📚 สูตร Prompt</h2><p><b>Character + Action + Place + Mood + Camera + Lighting + Style</b></p></section></main><script src="js/core.js"></script></body></html>
