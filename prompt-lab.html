<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Lab</title><link rel="stylesheet" href="css/style.css"></head><body>

<main class="wrap page"><span class="tag">INTERACTIVE LAB</span><h1>✍️ Prompt Lab</h1><p class="lead">กรอกองค์ประกอบ แล้วระบบจะประกอบ Prompt ให้ทดลองทันที</p>
<div class="lab"><div class="formbox">
<label>ตัวละคร<input id="char" placeholder="เช่น เด็กนักเรียนชายผมสั้น ใส่ชุดนักเรียน"></label>
<label>การกระทำ<input id="action" placeholder="เช่น กำลังวิ่งถือหนังสือ"></label>
<label>สถานที่<input id="place" placeholder="เช่น สนามโรงเรียนในตอนเช้า"></label>
<label>มุมกล้อง<select id="camera"><option>medium shot</option><option>close-up</option><option>wide shot</option><option>low angle</option></select></label>
<label>สไตล์<select id="style"><option>3D animation, cinematic</option><option>2D anime style</option><option>2D cartoon</option><option>stop motion style</option></select></label>
<button class="btn" onclick="buildPrompt()">✨ สร้าง Prompt</button></div>
<div class="output"><h2>ผลลัพธ์</h2><textarea id="output" placeholder="Prompt จะปรากฏตรงนี้"></textarea><button class="btn ghost" onclick="copyPrompt()">📋 คัดลอก Prompt</button><p id="copymsg"></p></div></div>
<div class="note"><b>เคล็ดลับ:</b> ระบุสิ่งที่ต้องการให้ชัด เช่น สีเสื้อ สีผม อารมณ์ แสง การเคลื่อนกล้อง และอัตราส่วนภาพ</div></main><script src="js/app.js"></script></body></html>
